name: GentleReset
options:
  bundleIdPrefix: com.philshobo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: GentleReset
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: YES
targets:
  GentleReset:
    type: application
    platform: iOS
    sources:
      - path: GentleReset
    resources:
      - path: GentleReset/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philshobo.GentleReset
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - GentleResetUITests
  GentleResetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GentleResetUITests
    dependencies:
      - target: GentleReset
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philshobo.GentleResetUITests
        PRODUCT_NAME: GentleResetUITests
