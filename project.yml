name: "everything mode"
options:
  bundleIdPrefix: com.philshobo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_NAME: "everything mode"
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7ER7B4U7Y5
targets:
  "everything mode":
    type: application
    platform: iOS
    sources:
      - path: EverythingMode
    resources:
      - path: EverythingMode/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philshobo.everythingmode
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INFOPLIST_KEY_CFBundleDisplayName: "everything mode"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - "everything mode UITests"
  "everything mode UITests":
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EverythingModeUITests
    dependencies:
      - target: "everything mode"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philshobo.everythingmodeUITests
        PRODUCT_NAME: "everything mode UITests"
